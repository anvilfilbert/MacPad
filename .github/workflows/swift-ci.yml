name: Swift CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Check public repository contents
        run: ./scripts/verify-public-repo.sh

      - name: Verify release notes for app version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          ./scripts/extract-release-notes.sh "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Run tests
        run: swift test

      - name: Check localizations
        run: ./scripts/check-localizations.sh

      - name: Run unsigned native preflight
        run: ./scripts/app-store-preflight.sh
