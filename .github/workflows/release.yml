name: Legacy ZIP preflight

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to verify without publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Verify legacy ZIP only
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Verify tag matches app version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $VERSION." >&2
            exit 1
          fi

      - name: Verify tagged commit belongs to main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAGGED_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" origin/main; then
            echo "Tagged commit $TAGGED_COMMIT is not contained in origin/main." >&2
            exit 1
          fi

      - name: Extract release notes from changelog
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          ./scripts/extract-release-notes.sh "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Check public repository contents
        run: ./scripts/verify-public-repo.sh

      - name: Run tests
        run: swift test

      - name: Build and verify universal release package
        run: ./scripts/package-release.sh
