name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches app version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $VERSION." >&2
            exit 1
          fi

      - name: Check public repository contents
        run: ./scripts/verify-public-repo.sh

      - name: Run tests
        run: swift test

      - name: Build and verify universal release package
        run: ./scripts/package-release.sh

      - name: Attest release package
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/MacPad-macOS-universal.zip

      - name: Create verified draft release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MacPad-macOS-universal.zip \
            dist/MacPad-macOS-universal.zip.sha256 \
            --draft \
            --generate-notes \
            --title "MacPad ${GITHUB_REF_NAME#v}" \
            --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
