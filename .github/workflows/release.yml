name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to verify and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Release
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Verify tag matches app version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $VERSION." >&2
            exit 1
          fi

      - name: Verify tagged commit belongs to main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAGGED_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" origin/main; then
            echo "Tagged commit $TAGGED_COMMIT is not contained in origin/main." >&2
            exit 1
          fi

      - name: Extract release notes from changelog
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          ./scripts/extract-release-notes.sh "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Check public repository contents
        run: ./scripts/verify-public-repo.sh

      - name: Run tests
        run: swift test

      - name: Build and verify universal release package
        run: ./scripts/package-release.sh

      - name: Attest release package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/MacPad-macOS-universal.zip

      - name: Create verified draft release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/MacPad-macOS-universal.zip \
              dist/MacPad-macOS-universal.zip.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/MacPad-macOS-universal.zip \
              dist/MacPad-macOS-universal.zip.sha256 \
              --draft \
              --verify-tag
          fi
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "MacPad ${RELEASE_TAG#v}"
